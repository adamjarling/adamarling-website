<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam Arling — Website Redesign Concepts</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; overflow: hidden; }
    #root { width: 100vw; height: 100vh; }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Components -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="variation-a.jsx"></script>
  <script type="text/babel" src="variation-b.jsx"></script>
  <script type="text/babel" src="variation-c.jsx"></script>

  <!-- App -->
  <script type="text/babel">
    /*
      DESIGN CONTEXT
      ──────────────
      Adam Arling — Chicago-born musician living in Vienna.
      Garage rock / blues / '60s–'70s aesthetic.
      Requested: high-contrast B&W with color pops, artsy-hipster-minimal.

      Concept A "Midnight Press" — dark editorial magazine feel.
        Cormorant Garamond + Space Grotesk, warm gold accent, full-bleed hero.

      Concept B "Zine Cut" — light brutalist zine / poster feel.
        Bebas Neue + Space Mono + DM Sans, hot red accent, split hero, numbered sections.
    */

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentA": "#C9944A",
      "accentB": "#8B5CF6",
      "accentC": "#00C9A7"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      return (
        <React.Fragment>
          <DesignCanvas>
            <DCSection id="concept-a" title='Concept A — "Midnight Press"'>
              <DCArtboard id="a-homepage" label="Dark editorial · serif + sans · gold accent" width={1440} height={3500}>
                <VariationA accent={t.accentA} />
              </DCArtboard>
            </DCSection>
            <DCSection id="concept-b" title='Concept B — "Zine Cut"'>
              <DCArtboard id="b-homepage" label="Light brutalist · condensed + mono · purple accent" width={1440} height={3300}>
                <VariationB accent={t.accentB} />
              </DCArtboard>
            </DCSection>
            <DCSection id="concept-c" title='Concept B+ — "Raw Nerve"'>
              <DCArtboard id="c-homepage" label="Extreme brutalist · outline type · clashing accents · inverted blocks" width={1440} height={3200}>
                <VariationC accent={t.accentC} />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel>
            <TweakSection label="Midnight Press" />
            <TweakColor
              label="Accent Color"
              value={t.accentA}
              onChange={v => setTweak('accentA', v)}
              options={['#C9944A', '#B87850', '#A0A0A0', '#8B6F4E']}
            />
            <TweakSection label="Zine Cut" />
            <TweakColor
              label="Accent Color"
              value={t.accentB}
              onChange={v => setTweak('accentB', v)}
              options={['#E63946', '#2563EB', '#FF6B35', '#8B5CF6']}
            />
            <TweakSection label="Raw Nerve" />
            <TweakColor
              label="Accent Color"
              value={t.accentC}
              onChange={v => setTweak('accentC', v)}
              options={['#8B5CF6', '#E63946', '#FF6B35', '#00C9A7']}
            />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
